<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Subasta TikTok</title>
<style>
body { 
    background: rgba(0,0,0,0.7);
    color: white; 
    font-family: Arial, sans-serif; 
    text-align: center; 
    margin:0;
    padding:0;
}
#container {
    width: 400px;
    height: 150px;
    margin: 20px auto;
    border: 4px solid gold;
    border-radius: 15px;
    padding: 10px;
    background: rgba(0,0,0,0.5);
}
h1 {
    font-size: 28px;
    color: gold;
    margin: 0;
}
#top {
    font-size: 24px;
    margin-top: 15px;
}
#timer {
    font-size: 20px;
    margin-top: 10px;
    color: #00ff00;
}
</style>
</head>
<body>

<div id="container">
    <h1>Subasta TikTok</h1>
    <div id="top">Esperando regalos...</div>
    <div id="timer">Tiempo: 00:00</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const streamerName = "danibrainyt";

let totalSeconds = 0;
let timerInterval = setInterval(() => {
    totalSeconds++;
    let minutes = String(Math.floor(totalSeconds / 60)).padStart(2,'0');
    let seconds = String(totalSeconds % 60).padStart(2,'0');
    document.getElementById("timer").innerHTML = `Tiempo: ${minutes}:${seconds}`;
}, 1000);

socket.on("update", data => {
    const div = document.getElementById("top");
    div.innerHTML = "Top: " + (data.topUser || streamerName) + " (" + data.topCoins + "💎)";
});
</script>

</body>
</html>
